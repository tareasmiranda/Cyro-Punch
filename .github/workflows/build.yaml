name: Build Miranda Organizer

on:
  push:
    branches-ignore:
      - data
      - gh-pages
    tags:
      - '**'
  pull_request:
    branches-ignore:
      - data
      - gh-pages

permissions:
  contents: write # Required to create a GitHub Release

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: Build with official kivy/buildozer Docker image
        id: buildozer
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/main:/home/user/hostcwd" \
            -v "${{ github.workspace }}/.buildozer_global:/home/user/.buildozer" \
            -w /home/user/hostcwd \
            kivy/buildozer:latest \
            buildozer android debug

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find main/bin -name "*.apk" -type f | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') # Only runs when a tag is pushed
        with:
          files: ${{ steps.find_apk.outputs.apk_path }} # Attach the built APK