name: Build Miranda Organizer

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || \
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Clean Buildozer Cache
        run: |
          rm -rf ~/.buildozer/android/packages
          rm -rf main/.buildozer

      - name: Build Python 3.10 Buildozer image (BallSpins)
        run: |
          git clone --depth 1 https://github.com/BallSpins/kivy-build.git
          docker build -t buildozer:android ./kivy-build

      - name: Build APK with Python 3.10 image
        id: buildozer
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/main:/app" \
            -v "${{ github.workspace }}/.buildozer_global:/root/.buildozer" \
            -w /app \
            buildozer:android \
            android debug

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find main/bin -name "*.apk" -type f | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}