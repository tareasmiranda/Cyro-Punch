name: Build Miranda Organizer

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('main/buildozer.spec') }}

      - name: Cache Buildozer local directory
        uses: actions/cache@v4
        with:
          path: main/.buildozer
          key: buildozer-local-${{ hashFiles('main/buildozer.spec') }}

	- name: Patch Dockerfile to use default OpenJDK
	  run: |
	    # Replace the openjdk-r PPA line with a direct install from default repos
	    sed -i '/ppa:openjdk-r\/ppa/d' Dockerfile
	    # Ensure openjdk-17-jdk is still installed (it should be available in default repos)
	    sed -i 's/RUN sudo apt-get -y install openjdk-17-jdk/RUN sudo apt-get -y install openjdk-17-jdk/' Dockerfile

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          repository_root: main
          workdir: .
          buildozer_version: 1.5.0   # <--- CRITICAL: Pins to a pre-Python 3.14 version
          command: buildozer android debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ steps.buildozer.outputs.filename }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.buildozer.outputs.filename }}