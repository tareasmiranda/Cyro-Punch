name: Build

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build for Android
    # ubuntu-latest is now Ubuntu 26.04 (Python 3.14).
    # Pin to 22.04 to match the toolchain the Docker image expects.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1.2.0
        id: buildozer
        with:
          # Set this to the folder that contains buildozer.spec and main.py.
          # If everything is at the repo root, use "." (or omit it).
          # If your files are in a subfolder called test_app, keep "test_app".
          workdir: .
          buildozer_version: stable

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.buildozer.outputs.filename }}
          archive: false

      - name: Attach APK to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.buildozer.outputs.filename }}
          generate_release_notes: true