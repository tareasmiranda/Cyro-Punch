name: Build Miranda Organizer

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('main/buildozer.spec') }}

      - name: Cache Buildozer local directory
        uses: actions/cache@v4
        with:
          path: main/.buildozer
          key: buildozer-local-${{ hashFiles('main/buildozer.spec') }}

      - name: Buildozer action (fix)
        # You may pin to the exact commit or the version.
        # uses: gxosty/buildozer-action@cfc8b8ad4542146d18aaf2b495f36c13104ddd8c
        uses: gxosty/buildozer-action@1.0.8
        with:
          # Command to start Buildozer. Set to `buildozer ios debug` for iOS
          command: # default is buildozer android debug
          # Path to cloned repository. Set if you specified path for `actions/checkout` action.
          repository_root: # default is .
          # Working directory where buildozer.spec is located. Set to `src` if buildozer.spec is in `src` directory. Defaults to `.`
          workdir: # default is .
          # Version of Buildozer to install. By default installs latest release
          buildozer_version: # default is stable

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ steps.buildozer.outputs.filename }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.buildozer.outputs.filename }}
